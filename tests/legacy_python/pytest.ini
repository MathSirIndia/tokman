[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Fast offline unit tests without external service dependencies
    integration: Service contract and container-to-container integration tests
    e2e: End-to-end full stack verification suites
    module1: Tests specific to Module 1 (Core Routing & Persistence)
    module2: Tests specific to Module 2 (FastAPI Interceptor)
    module3: Tests specific to Module 3 (Autonomous Supervisor)
    resiliency: Rate limit, circuit breaker, and chaos recovery tests
